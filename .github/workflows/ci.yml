name: CI

# Build artifacts and test logs are uploaded with actions/upload-artifact@v4
# by all build jobs (see scripts/ci-artifacts.sh):
#
#   lighttpd-linux-<build-system>-<compiler>       Linux binary + modules (.so)
#   lighttpd-linux-alpine-<build-system>-<arch>    Alpine Linux binary + modules
#   lighttpd-macos-meson-<arch>                    macOS binary + modules
#   lighttpd-{freebsd,dragonflybsd,netbsd,openbsd}-<build-system>-<arch>
#                                                  BSD binary + modules
#   lighttpd-solaris-<build-system>-<compiler>     Solaris binary + modules
#   lighttpd-windows-msvc-<arch>                   lighttpd.exe + modules/.dll
#   lighttpd-windows-msys2-<platform>              lighttpd.exe + modules/.dll
#   lighttpd-windows-cygwin-<arch>                 lighttpd.exe + modules/.dll
#   test-logs-<platform>                           build/test logs (uploaded
#                                                  with if: always(), so that
#                                                  failed runs keep their logs)
#
# Binaries are only uploaded if the job succeeded (if: success()) and after a
# smoke test which runs the collected 'lighttpd -v'.
# Test logs are written by scripts/ci-build.sh into artifacts/logs when
# CI_TEST_LOG_DIR is set; ctest/meson/lighttpd test framework logs are
# collected on top of that.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - ci
    tags:
      - lighttpd-*
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.head_ref}}
  cancel-in-progress: true

jobs:

  # note: could combine Linux-ubuntu-gcc and Linux-ubuntu-clang by using
  #     strategy: matrix: compiler: ['gcc','clang']
  #   but a bit excessive for combinatorial explosion of different build systems
  # note: use compiler package gcc-multilib or clang-multilib
  #   if platform not x64 or Windows

  Linux-ubuntu-gcc:
    runs-on: ubuntu-latest
    name: Linux-ubuntu-${{matrix.platform}}-${{matrix.compiler}}
    strategy:
      matrix:
        platform: ['x64']
        compiler: ['gcc']
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -yq --no-install-recommends \
            build-essential ${{matrix.compiler}} \
            cmake meson ninja-build pkg-config scons \
            autoconf automake autotools-dev libtool m4 \
            nettle-dev gnutls-dev \
            libmbedtls-dev libnss3-dev libssl-dev \
            libpcre2-dev libbrotli-dev libdeflate-dev zlib1g-dev libzstd-dev \
            libsasl2-dev libkrb5-dev libdbi-dev libpam-dev libldap-dev \
            libmariadb-dev libpq-dev \
            libmaxminddb-dev libunwind-dev liblua5.1-0-dev liblua5.4-dev \
            libxml2-dev libsqlite3-dev
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (meson test, ctest -V, scons
        # check, make check); CI_TEST_LOG_DIR additionally writes their output
        # to artifacts/logs/<log-name>.log for upload as test-log artifact
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        run: |
          set -e
          cd "${{github.workspace}}" && scripts/ci-build.sh meson
          #cd "${{github.workspace}}" && scripts/ci-build.sh cmake
          cd "${{github.workspace}}" && scripts/ci-build.sh cmake-asan
          cd "${{github.workspace}}" && scripts/ci-build.sh scons
          cd "${{github.workspace}}" && scripts/ci-build.sh autobuild
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: Linux ubuntu-${{matrix.platform}} ${{matrix.compiler}}
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson cmake-asan scons autobuild
      - name: Smoke test (run collected binaries)
        if: success()
        run: |
          set -e
          for b in meson cmake cmake-asan scons autobuild; do
            [ -x "artifacts/binaries/$b/lighttpd" ] || continue
            echo "--- $b"
            "artifacts/binaries/$b/lighttpd" -v
          done
      - name: Upload lighttpd binaries (meson)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-meson-${{matrix.compiler}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (cmake, address sanitizer)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-cmake-asan-${{matrix.compiler}}
          path: artifacts/binaries/cmake-asan/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (scons)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-scons-${{matrix.compiler}}
          path: artifacts/binaries/scons/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (autobuild)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-autobuild-${{matrix.compiler}}
          path: artifacts/binaries/autobuild/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-ubuntu-${{matrix.platform}}-${{matrix.compiler}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Linux-ubuntu-clang:
    runs-on: ubuntu-latest
    name: Linux-ubuntu-${{matrix.platform}}-${{matrix.compiler}}
    strategy:
      matrix:
        platform: ['x64']
        compiler: ['clang']
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -yq --no-install-recommends \
            build-essential ${{matrix.compiler}} \
            cmake meson ninja-build pkg-config scons \
            autoconf automake autotools-dev libtool m4 \
            nettle-dev gnutls-dev \
            libmbedtls-dev libnss3-dev libssl-dev \
            libpcre2-dev libbrotli-dev libdeflate-dev zlib1g-dev libzstd-dev \
            libsasl2-dev libkrb5-dev libdbi-dev libpam-dev libldap-dev \
            libmariadb-dev libpq-dev \
            libmaxminddb-dev libunwind-dev liblua5.1-0-dev liblua5.4-dev \
            libxml2-dev libsqlite3-dev
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (ctest -V); CI_TEST_LOG_DIR
        # additionally writes their output to artifacts/logs/<log-name>.log
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        run: |
          set -e
          #cd "${{github.workspace}}" && scripts/ci-build.sh meson
          cd "${{github.workspace}}" && scripts/ci-build.sh cmake
          #cd "${{github.workspace}}" && scripts/ci-build.sh scons
          #cd "${{github.workspace}}" && scripts/ci-build.sh autobuild
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: Linux ubuntu-${{matrix.platform}} ${{matrix.compiler}}
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries cmake
      - name: Smoke test (run collected binaries)
        if: success()
        run: |
          set -e
          for b in meson cmake cmake-asan scons autobuild; do
            [ -x "artifacts/binaries/$b/lighttpd" ] || continue
            echo "--- $b"
            "artifacts/binaries/$b/lighttpd" -v
          done
      - name: Upload lighttpd binaries (cmake)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-cmake-${{matrix.compiler}}
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-ubuntu-${{matrix.platform}}-${{matrix.compiler}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          brew install -q meson ninja pkg-config pcre2 perl \
            gnutls libressl mbedtls nettle nss wolfssl \
            cyrus-sasl krb5 libdbi openldap \
            mariadb-connector-c libpq \
            brotli libdeflate zlib zstd \
            libmaxminddb lua \
            libxml2 sqlite
          # autoconf automake libtool m4 cmake scons
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (meson test --verbose);
        # CI_TEST_LOG_DIR additionally writes their output to
        # artifacts/logs/<log-name>.log for upload as test-log artifact
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        run: |
          set -e
          export WITH_WOLFSSL=1
          export NO_UNWIND=1
          cd "${{github.workspace}}" && scripts/ci-build.sh meson
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: macOS ${{runner.arch}} (meson)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson
      - name: Smoke test (run collected binaries)
        if: success()
        run: |
          set -e
          for b in meson cmake cmake-asan scons autobuild; do
            [ -x "artifacts/binaries/$b/lighttpd" ] || continue
            echo "--- $b"
            "artifacts/binaries/$b/lighttpd" -v
          done
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-macos-meson-${{runner.arch}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos-${{runner.arch}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  DragonflyBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y bash ninja meson pkgconf pcre2 perl5
          run: |
            set -e
            meson setup "${{github.workspace}}/build" -Dwarning_level=3
            meson compile -C "${{github.workspace}}/build" --verbose
            # test output is also written to artifacts/logs (see below)
            mkdir -p "${{github.workspace}}/artifacts/logs"
            meson test -C "${{github.workspace}}/build" --verbose \
              > "${{github.workspace}}/artifacts/logs/tests-meson.log" 2>&1 || rc=$?
            cat "${{github.workspace}}/artifacts/logs/tests-meson.log"
            if [ "${rc:-0}" -ne 0 ]; then exit "$rc"; fi
            # smoke test: collected below and executed here, since a
            # binary for this VM OS can not run on the runner
            if [ -x "build/src/lighttpd" ]; then
              echo "--- build/src/lighttpd"
              "build/src/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: DragonFlyBSD ${{runner.arch}} (meson)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-dragonflybsd-meson-${{runner.arch}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-dragonflybsd
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  FreeBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          mem: 11264
          cpu: 4
          usesh: true
          # build results are copied back from the VM to the runner (rsync is
          # the default sync method), so that the artifacts can be uploaded
          copyback: true
          prepare: |
            mount -t procfs proc /proc
          run: |
            #mkdir -p /usr/local/etc/pkg/repos
            #echo 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f -q
            pkg upgrade -y
            pkg install -y autoconf automake autotools libtool m4 pkgconf \
              ninja meson cmake scons-py312 pcre2 perl5 \
              gnutls libressl mbedtls3 nettle nss wolfssl \
              cyrus-sasl krb5 libdbi openldap26-client \
              mariadb1011-client postgresql16-client \
              brotli libdeflate zstd \
              libmaxminddb libunwind lua51 lua54 \
              libxml2 sqlite3
            set -e
            export WITH_WOLFSSL=1
            # tests are run by scripts/ci-build.sh (meson test, ctest -V,
            # scons check, make check); CI_TEST_LOG_DIR additionally writes
            # their output to artifacts/logs/<log-name>.log
            export CI_TEST_LOG_DIR=artifacts/logs
            cd "${{github.workspace}}" && scripts/ci-build.sh meson
            cd "${{github.workspace}}" && scripts/ci-build.sh cmake
            cd "${{github.workspace}}" && scripts/ci-build.sh scons
            cd "${{github.workspace}}" && scripts/ci-build.sh autobuild
            # smoke test: collected below and executed here, since a
            # binary for this VM OS can not run on the runner
            if [ -x "build/src/lighttpd" ]; then
              echo "--- build/src/lighttpd"
              "build/src/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
            if [ -x "cmakebuild/build/lighttpd" ]; then
              echo "--- cmakebuild/build/lighttpd"
              "cmakebuild/build/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
            if [ -x "sconsbuild/build/lighttpd" ]; then
              echo "--- sconsbuild/build/lighttpd"
              "sconsbuild/build/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
            if [ -x "src/.libs/lighttpd" ]; then
              echo "--- src/.libs/lighttpd"
              "src/.libs/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: FreeBSD ${{runner.arch}} (meson, cmake, scons, autotools)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson cmake scons autobuild
      - name: Upload lighttpd binaries (meson)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-freebsd-meson-${{runner.arch}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (cmake)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-freebsd-cmake-${{runner.arch}}
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (scons)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-freebsd-scons-${{runner.arch}}
          path: artifacts/binaries/scons/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (autobuild)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-freebsd-autobuild-${{runner.arch}}
          path: artifacts/binaries/autobuild/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-freebsd
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  NetBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/netbsd-vm@v1
        with:
          #usesh: true
          prepare: |
            pkg_add -u dash cmake ninja pkgconf pcre2 perl \
              gnutls libressl mbedtls nettle nss wolfssl \
              cyrus-sasl mit-krb5 libdbi openldap-client \
              mariadb-client postgresql16-client \
              brotli libdeflate zlib zstd \
              libmaxminddb libunwind lua51 lua54 \
              libxml2 sqlite3
          # autoconf automake gmake libtool m4 meson py311-scons
          run: |
            set -e
            export WITH_WOLFSSL=1
            export NO_UNWIND=1
            # tests are run by scripts/ci-build.sh (ctest -V); CI_TEST_LOG_DIR
            # additionally writes their output to artifacts/logs
            export CI_TEST_LOG_DIR=artifacts/logs
            cd "${{github.workspace}}" && scripts/ci-build.sh cmake
            # smoke test: collected below and executed here, since a
            # binary for this VM OS can not run on the runner
            if [ -x "cmakebuild/build/lighttpd" ]; then
              echo "--- cmakebuild/build/lighttpd"
              "cmakebuild/build/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: NetBSD ${{runner.arch}} (cmake)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries cmake
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-netbsd-cmake-${{runner.arch}}
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-netbsd
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  OpenBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add ninja meson pkgconf pcre2 \
              gnutls mbedtls libnettle nss \
              cyrus-sasl-- heimdal-libs libdbi openldap-client-- \
              mariadb-client postgresql-client \
              brotli libdeflate zstd \
              libmaxminddb lua--%5.1 lua--%5.4 \
              libxml sqlite3
          # autoconf automake cmake gmake libtool m4 scons
          run: |
            set -e
            export NO_PAM=1 NO_UNWIND=1 NO_WOLFSSL=1
            # tests are run by scripts/ci-build.sh (meson test --verbose);
            # CI_TEST_LOG_DIR additionally writes their output to artifacts/logs
            export CI_TEST_LOG_DIR=artifacts/logs
            cd "${{github.workspace}}" && scripts/ci-build.sh meson
            # smoke test: collected below and executed here, since a
            # binary for this VM OS can not run on the runner
            if [ -x "build/src/lighttpd" ]; then
              echo "--- build/src/lighttpd"
              "build/src/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: OpenBSD ${{runner.arch}} (meson)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-openbsd-meson-${{runner.arch}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-openbsd
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  # Solaris VM test is slow compared to other VMs tests
  # (retrieving and installing packages may be slow)
  Solaris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc"
          usesh: true
          # build results are copied back from the VM to the runner (rsync is
          # the default sync method), so that the artifacts can be uploaded
          copyback: true
          prepare: |
            pkgutil -U
            pkgutil -y -i cmake gmake pkgconfig perl \
              libpcre2_dev \
              libnettle_dev libgnutls_dev libnss_dev libssl_dev \
              libbrotli_dev libz_dev libzstd_dev \
              libkrb5_dev libdbi_dev openldap_dev sasl_dev \
              mysql56_dev postgresql_dev \
              lua_dev \
              libxml2_dev libsqlite3_dev
          run: |
            set -e
            cmake -S "${{github.workspace}}" -B "build" -Wno-dev -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_EXTRA_WARNINGS=ON \
              -DWITH_PCRE2=ON \
              -DWITH_ZLIB=ON \
              -DWITH_LDAP=ON \
              -DWITH_DBI=ON \
              -DWITH_PGSQL=ON \
              -DWITH_SASL=ON \
              -DWITH_GNUTLS=ON \
              -DWITH_NETTLE=ON \
              -DWITH_NSS=ON \
              -DWITH_OPENSSL=ON \
              -DWITH_WEBDAV_PROPS=ON
            cmake --build build --config Release
            # verbose test output is also written to artifacts/logs
            mkdir -p "${{github.workspace}}/artifacts/logs"
            ctest -V --test-dir build --build-config Release --no-tests=error \
              --output-log "${{github.workspace}}/artifacts/logs/ctest-unit-tests.log"
            # smoke test: collected below and executed here, since a
            # binary for this VM OS can not run on the runner
            if [ -x "build/build/lighttpd" ]; then
              echo "--- build/build/lighttpd"
              "build/build/lighttpd" -v 2>&1 || echo "warning: smoke test failed with status $?"
            fi
            # no packages for libdeflate, maxminddb, mbedtls
            #   (modifications needed for scripts/ci-build.sh)
            # additional work needed for build config to find lua, brotli, zstd
            # additional work needed for build to find 64-bit mysql libs
            # additional work needed for build to find krb5.h
            #set -e
            #export NO_PAM=1 NO_UNWIND=1 NO_WOLFSSL=1
            #export NO_LIBDEFLATE=1 NO_MAXMINDDB=1 NO_MBEDTLS=1
            #cd "${{github.workspace}}" && scripts/ci-build.sh cmake
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: Solaris 11.4 (cmake, CBE gcc)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries cmake
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-solaris-cmake-gcc
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-solaris
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Windows-Cygwin:
    runs-on: windows-latest
    env:
      CYGWIN: winsymlinks:native
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - name: Set up env and create cache dir
        id: env
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CACHE_KEY=$(Get-Date -UFormat "%Y-%m")" -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force -Path D:\cygwin
      - name: Cache Cygwin installation
        uses: actions/cache@v6
        with:
          path: /cygwin
          key: cygwin-${{ runner.os }}-${{ env.CACHE_KEY }}
          restore-keys: |
            cygwin-${{ runner.os }}-${{ env.CACHE_KEY }}
      #- name: Create Cygwin package dir under Cygwin cache dir
      #  shell: pwsh
      #  run: |
      #    New-Item -ItemType Directory -Force -Path D:\cygwin\packages
      #    New-Item -ItemType SymbolicLink -Path D:\cygwin-packages -Target D:\cygwin\packages
      - uses: cygwin/cygwin-install-action@master
        with:
          install-dir: D:\cygwin
          allow-test-packages: true
          packages: >
            autoconf automake libtool m4 make
            cmake meson ninja scons
            gcc-g++ git pkgconf perl
            libpcre2-devel
            libnettle-devel
            libgnutls-devel mbedtls-devel libnss-devel libssl-devel
            libbrotli-devel libdeflate-devel zlib-devel libzstd-devel
            libsasl2-devel libkrb5-devel libdbi-devel openldap-devel
            libmariadb-devel libpq-devel
            libmaxminddb-devel libunwind-devel lua-devel lua5.1-devel
            libxml2-devel libsqlite3-devel
            libintl-devel
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (make check); CI_TEST_LOG_DIR
        # additionally writes their output to artifacts/logs/<log-name>.log
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          set -e
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32
          export NO_PAM=1 NO_UNWIND=1 NO_WOLFSSL=1
          export SHELL=/bin/dash
          cd "${{github.workspace}}" && /bin/dash scripts/ci-build.sh autobuild
      - name: Collect build artifacts
        if: success()
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        env:
          CI_ARTIFACT_NOTE: Windows Cygwin x86_64 (autotools; needs D:\cygwin\bin in PATH, e.g. via cygwin1.dll next to the binaries)
        run: |
          set -e
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32
          cd "${{github.workspace}}"
          sh scripts/ci-artifacts.sh binaries artifacts/binaries autobuild
      - name: Smoke test (run collected binary)
        if: success()
        continue-on-error: true
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          set -e
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32
          echo "--- collected files:"
          ls -l artifacts/binaries/autobuild artifacts/binaries/autobuild/modules || true
          for exe in artifacts/binaries/autobuild/lighttpd.exe \
                     artifacts/binaries/autobuild/lighttpd; do
            [ -f "${exe}" ] || continue
            echo "--- ${exe}"
            if "${exe}" -v; then
              exit 0
            else
              rc=$?
              echo "::error::${exe} -v failed with status ${rc}"
              echo "::error::PATH=${PATH}"
              echo "::error::ls=$(ls -l artifacts/binaries/autobuild | tr '\n' ' ' | tr -d '\r' | cut -c1-1200)"
              echo "::error::ldd=$(ldd "${exe}" 2>&1 | tr '\n' ' ' | tr -d '\r' | cut -c1-1200)"
              exit "${rc}"
            fi
          done
          echo "::error::no lighttpd binary in artifacts/binaries/autobuild" >&2
          exit 1
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-windows-cygwin-x86_64
          path: artifacts/binaries/autobuild/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          set -e
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32
          cd "${{github.workspace}}"
          sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-cygwin
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Windows-VisualStudio:
    runs-on: windows-2025-vs2026
    name: Windows-VisualStudio-${{matrix.platform}}
    strategy:
      matrix:
        platform: ['x64']
        #platform: ['x64', 'win32']
    #error: The GHA binary source requires the ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL environment variables to be set. See https://learn.microsoft.com/vcpkg/users/binarycaching?WT.mc_id=vcpkg_inproduct_cli#gha for details.
    env:
       VCPKG_ROOT: 'C:\vcpkg'
    #  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{matrix.platform}}
      - name: Install dependencies
        run: vcpkg install --triplet ${{matrix.platform}}-windows --vcpkg-root 'C:\vcpkg' pkgconf pcre2 zlib
        # building with openssl increases CI build execution time from 3 minutes to 12 minutes
        # XXX: TODO: add cache for C:\vcpkg to reduce third-party lib rebuilds?
        #run: vcpkg install --triplet ${{matrix.platform}}-windows --vcpkg-root 'C:\vcpkg' pkgconf pcre2 zlib openssl
      - name: Compile
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -G "Visual Studio 18 2026" -A "${{matrix.platform}}" -S "${{github.workspace}}" -B "build" -Wno-dev -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' -DCMAKE_BUILD_TYPE=Release
          #cmake -G "Visual Studio 18 2026" -A "${{matrix.platform}}" -S "${{github.workspace}}" -B "build" -Wno-dev -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake' -DCMAKE_BUILD_TYPE=Release -DWITH_OPENSSL=ON
          cmake --build build --config Release
      - name: Run unit tests (ctest)
        # run the compiled unit tests src/t/test_*;
        # (skip the Perl test framework in tests/*)
        # (note: tests/CMakeLists.txt also skips Perl tests/* on native WIN32)
        # (verbose output is also written to artifacts/logs for the test-log artifact)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "artifacts/logs" | Out-Null
          ctest -V --test-dir build --build-config Release --no-tests=error -R '^test_' --output-log "artifacts/logs/ctest-unit-tests.log"
      - name: Collect build artifacts
        if: success()
        shell: bash
        env:
          CI_ARTIFACT_NOTE: Windows MSVC ${{matrix.platform}} Release
          CI_RUNTIME_DLL_DIRS: C:/vcpkg/installed/${{matrix.platform}}-windows/bin
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries cmake
      - name: Smoke test (run collected binary)
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          & "artifacts/binaries/cmake/lighttpd.exe" -v
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-windows-msvc-${{matrix.platform}}
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        shell: bash
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-visualstudio-${{matrix.platform}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Windows-MSYS2:
    runs-on: windows-latest
    name: Windows-MSYS2-${{matrix.platform}}
    strategy:
      matrix:
        platform: ['mingw64', 'ucrt64', 'clang64']
        #platform: ['mingw32', 'mingw64', 'ucrt64', 'clang32', 'clang64']
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.platform}}
          update: true
          install: git m4
          pacboy: >-
            cc:p autotools:p libtool:p make:p pcre2:p pkgconf:p
            nettle:p gnutls:p mbedtls:p nss:p openssl:p
            brotli:p libdeflate:p zlib:p zstd:p
            cyrus-sasl:p openldap:p
            libmariadbclient:p postgresql:p
            libmaxminddb:p libunwind:p lua51:p lua:p luajit:p
            libxml2:p sqlite3:p
          # heimdal-devel: available only on platform: msys (?)
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (make check); CI_TEST_LOG_DIR
        # additionally writes their output to artifacts/logs/<log-name>.log
        shell: msys2 {0}
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        run: |
          set -e
          # NO_GNUTLS=1 gnutls/socket.h can not find <sys/socket.h>
          # NO_MYSQL=1 build not finding mysql_config
          export NO_DBI=1 NO_GNUTLS=1 NO_KRB5=1 NO_MYSQL=1 NO_PAM=1 NO_UNWIND=1 NO_WOLFSSL=1
          export SHELL=/bin/dash
          cd "${{github.workspace}}" && /bin/dash scripts/ci-build.sh autobuild
      - name: Collect build artifacts
        if: success()
        shell: msys2 {0}
        env:
          CI_ARTIFACT_NOTE: Windows MSYS2 ${{matrix.platform}} (autotools)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries autobuild
      - name: Smoke test (run collected binary)
        if: success()
        shell: msys2 {0}
        run: artifacts/binaries/autobuild/lighttpd.exe -v
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-windows-msys2-${{matrix.platform}}
          path: artifacts/binaries/autobuild/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        shell: msys2 {0}
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-msys2-${{matrix.platform}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Linux-alpine-x86_64:
    runs-on: ubuntu-latest
    name: Linux-alpine-${{matrix.platform}}
    # abort if x86_64 fails (x86_64 or x86 are fastest "native" builds)
    continue-on-error: ${{ matrix.platform != 'x86_64' }}
    strategy:
      fail-fast: true
      matrix:
        platform: ['x86_64']
    steps:
      - uses: actions/checkout@v7
      - uses: jirutka/setup-alpine@v1
        with:
          branch: latest-stable
          arch: ${{matrix.platform}}
          packages: >
            build-base cmake meson ninja pkgconf perl scons
            autoconf automake libtool m4
            gnutls-dev mbedtls-dev openssl-dev nettle-dev nss-dev
            pcre2-dev brotli-dev libdeflate-dev zlib-dev zstd-dev
            cyrus-sasl-dev krb5-dev libdbi-dev linux-pam-dev openldap-dev
            mariadb-connector-c-dev postgresql16-dev
            libmaxminddb-dev libunwind-dev lua5.1-dev lua5.5-dev
            libxml2-dev sqlite-dev
            zlib-static openssl-libs-static pcre2-static
      - name: Compile and Test
        # tests are run by scripts/ci-build.sh (meson test, ctest -V, scons
        # check, make check); CI_TEST_LOG_DIR additionally writes their output
        # to artifacts/logs/<log-name>.log for upload as test-log artifact
        shell: alpine.sh {0}
        env:
          CI_TEST_LOG_DIR: artifacts/logs
        run: |
          set -e
          export SHELL=/bin/sh
          # Alpine Linux wolfssl package built w/o features required by lighttpd
          #('scons check_fullstatic' needs *-static packages in list above)
          export NO_WOLFSSL=1
          cd "${{github.workspace}}" && scripts/ci-build.sh meson
          cd "${{github.workspace}}" && scripts/ci-build.sh cmake
          cd "${{github.workspace}}" && scripts/ci-build.sh scons
          cd "${{github.workspace}}" && scripts/ci-build.sh autobuild
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: Linux alpine-${{matrix.platform}}
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson cmake scons autobuild
      - name: Smoke test (run collected binaries)
        if: success()
        shell: alpine.sh {0}
        run: |
          set -e
          for b in meson cmake scons autobuild; do
            [ -x "artifacts/binaries/$b/lighttpd" ] || continue
            echo "--- $b"
            "artifacts/binaries/$b/lighttpd" -v
          done
      - name: Upload lighttpd binaries (meson)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-alpine-meson-${{matrix.platform}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (cmake)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-alpine-cmake-${{matrix.platform}}
          path: artifacts/binaries/cmake/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (scons)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-alpine-scons-${{matrix.platform}}
          path: artifacts/binaries/scons/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload lighttpd binaries (autobuild)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-alpine-autobuild-${{matrix.platform}}
          path: artifacts/binaries/autobuild/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-alpine-${{matrix.platform}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30

  Linux-alpine:
    runs-on: ubuntu-latest
    name: Linux-alpine-${{matrix.platform}}
    # abort if x86 fails (x86_64 or x86 are fastest "native" builds)
    continue-on-error: ${{ matrix.platform != 'x86' }}
    strategy:
      fail-fast: true
      matrix:
        platform: ['x86','armhf','armv7','aarch64','ppc64le','riscv64','s390x']
    steps:
      - uses: actions/checkout@v7
      - uses: jirutka/setup-alpine@v1
        with:
          # riscv64 currently requires 'edge'
          branch: edge
          arch: ${{matrix.platform}}
          packages: >
            build-base meson ninja perl pkgconf pcre2-dev zlib-dev
      - name: Compile and Test
        # test output is also written to artifacts/logs (see below)
        shell: alpine.sh {0}
        run: |
          set -e
          export SHELL=/bin/sh
          meson setup "${{github.workspace}}/build" -Dwarning_level=3
          meson compile -C "${{github.workspace}}/build" --verbose
          mkdir -p "${{github.workspace}}/artifacts/logs"
          meson test -C "${{github.workspace}}/build" --verbose \
            > "${{github.workspace}}/artifacts/logs/tests-meson.log" 2>&1 || rc=$?
          cat "${{github.workspace}}/artifacts/logs/tests-meson.log"
          if [ "${rc:-0}" -ne 0 ]; then exit "$rc"; fi
      - name: Collect build artifacts
        if: success()
        env:
          CI_ARTIFACT_NOTE: Alpine Linux ${{matrix.platform}} (meson)
        run: sh scripts/ci-artifacts.sh binaries artifacts/binaries meson
      - name: Smoke test (run collected binaries)
        if: success()
        shell: alpine.sh {0}
        run: |
          set -e
          for b in meson cmake cmake-asan scons autobuild; do
            [ -x "artifacts/binaries/$b/lighttpd" ] || continue
            echo "--- $b"
            "artifacts/binaries/$b/lighttpd" -v
          done
      - name: Upload lighttpd binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-linux-alpine-meson-${{matrix.platform}}
          path: artifacts/binaries/meson/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect test logs
        if: always()
        run: sh scripts/ci-artifacts.sh test-logs artifacts/logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-alpine-${{matrix.platform}}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30
